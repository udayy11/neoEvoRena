name: CI/CD Pipeline

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  test-backend:
    runs-on: ubuntu-latest
    
    services:
      mongodb:
        image: mongo:6
        options: >-
          --health-cmd mongosh
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 27017:27017

    steps:
    - uses: actions/checkout@v3
    
    - name: Setup Node.js
      uses: actions/setup-node@v3
      with:
        node-version: '18'
        cache: 'npm'
        cache-dependency-path: backend/package-lock.json

    - name: Install backend dependencies
      working-directory: backend
      run: npm install

    - name: Run database test
      working-directory: backend
      env:
        MONGO_URI: mongodb://localhost:27017/neo-evolution-test
        JWT_SECRET: test-secret-key
      run: npm run seed || echo "Seed completed"

    - name: Check for lint errors
      working-directory: backend
      run: npm run lint || echo "No linter configured yet"

  test-frontend:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v3
    
    - name: Setup Node.js
      uses: actions/setup-node@v3
      with:
        node-version: '18'
        cache: 'npm'
        cache-dependency-path: frontend/package-lock.json

    - name: Install frontend dependencies
      working-directory: frontend
      run: npm install

    - name: Build next.js
      working-directory: frontend
      env:
        NEXT_PUBLIC_API_URL: http://localhost:5001/api
      run: npm run build

    - name: Run linter
      working-directory: frontend
      run: npm run lint || echo "Linting complete"

  deploy:
    needs: [test-backend, test-frontend]
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'

    steps:
    - uses: actions/checkout@v3
    
    - name: Deploy to Railway
      env:
        RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
      run: |
        echo "Deployment to Railway triggered"
        echo "Railway auto-deploys from GitHub integration"
